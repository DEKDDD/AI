<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Courier - AI Search & Map Editor</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1e1e2e;
        color: #cdd6f4;
        text-align: center;
        user-select: none;
      }

      /* Palette Tools */
      .palette {
        background: #313244;
        padding: 15px;
        border-radius: 8px;
        display: inline-flex;
        gap: 10px;
        margin-bottom: 20px;
        align-items: center;
      }
      .brush-btn {
        padding: 10px 15px;
        border: 2px solid transparent;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        background: #45475a;
        color: #cdd6f4;
        transition: 0.2s;
      }
      .brush-btn.active {
        border-color: #a6e3a1;
        transform: scale(1.05);
      }

      .container {
        display: flex;
        justify-content: center;
        gap: 40px;
      }
      .map-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(6, 40px);
        gap: 2px;
        background: #313244;
        padding: 5px;
        border-radius: 8px;
        cursor: crosshair;
      }
      .cell {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 14px;
        border-radius: 4px;
        transition:
          background-color 0.15s ease,
          transform 0.1s ease;
      }
      .cell:hover {
        filter: brightness(1.2);
      }

      /* สีกระเบื้อง */
      .empty {
        background-color: #45475a;
      }
      .wall {
        background-color: #f38ba8;
      }
      .portal {
        background-color: #cba6f7;
        color: #11111b;
      }
      .start {
        background-color: #a6e3a1;
        color: #11111b;
      }
      .goal {
        background-color: #f9e2af;
        color: #11111b;
      }

      .visited {
        background-color: #585b70;
        transform: scale(0.95);
      }
      .path {
        background-color: #89b4fa;
        color: #11111b;
        transform: scale(1.05);
        box-shadow: 0 0 8px #89b4fa;
      }

      .controls {
        margin: 20px;
      }
      button.action-btn {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #89b4fa;
        color: #11111b;
        font-weight: bold;
        transition: 0.2s;
      }
      button.action-btn:hover:not(:disabled) {
        background-color: #74c7ec;
      }
      button.action-btn:disabled {
        background-color: #585b70;
        cursor: not-allowed;
        opacity: 0.7;
      }

      #stats {
        margin-top: 20px;
        font-size: 1.2em;
        background: #313244;
        display: inline-block;
        padding: 15px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h2>📦 Quantum Courier: Map Editor & Pathfinding</h2>

    <div class="palette">
      <span>เครื่องมือวาดแผนที่: </span>
      <button
        class="brush-btn"
        id="brush-1"
        onclick="setBrush(1, this)"
        style="background-color: #f38ba8; color: #11111b"
      >
        กำแพง
      </button>
      <button class="brush-btn active" id="brush-0" onclick="setBrush(0, this)">
        ยางลบ (ทางเดิน)
      </button>
      <button
        class="brush-btn"
        id="brush-2"
        onclick="setBrush(2, this)"
        style="background-color: #cba6f7; color: #11111b"
      >
        🌀 พอร์ทัล
      </button>
      <button
        class="brush-btn"
        id="brush-3"
        onclick="setBrush(3, this)"
        style="background-color: #a6e3a1; color: #11111b"
      >
        S จุดเริ่มต้น
      </button>
      <button
        class="brush-btn"
        id="brush-4"
        onclick="setBrush(4, this)"
        style="background-color: #f9e2af; color: #11111b"
      >
        G เป้าหมาย
      </button>
    </div>

    <div class="controls">
      <button class="action-btn" id="btn-ucs" onclick="runSearch('UCS')">
        Run Uniform Cost Search
      </button>
      <button class="action-btn" id="btn-astar" onclick="runSearch('ASTAR')">
        Run A* Search
      </button>
      <button
        class="action-btn"
        id="btn-clear"
        onclick="clearPath()"
        style="background-color: #f38ba8"
      >
        Clear Path
      </button>
    </div>

    <div class="container">
      <div class="map-container">
        <h3>Dimension A</h3>
        <div id="gridA" class="grid"></div>
      </div>
      <div class="map-container">
        <h3>Dimension B</h3>
        <div id="gridB" class="grid"></div>
      </div>
    </div>

    <div id="stats">
      Cost: - | Nodes Expanded: - | Max Memory: - nodes | Runtime: - ms
    </div>

    <script>
      const ROW = 6,
        COL = 6;
      const COST_MOVE = 1,
        COST_PORTAL = 4;
      class PriorityQueue {
        constructor() {
          this.values = [];
        }
        push(val) {
          this.values.push(val);
          this.bubbleUp();
        }
        shift() {
          const min = this.values[0];
          const end = this.values.pop();
          if (this.values.length > 0) {
            this.values[0] = end;
            this.sinkDown();
          }
          return min;
        }
        bubbleUp() {
          let idx = this.values.length - 1;
          const element = this.values[idx];
          while (idx > 0) {
            let parentIdx = Math.floor((idx - 1) / 2);
            let parent = this.values[parentIdx];
            if (element.f >= parent.f) break;
            this.values[parentIdx] = element;
            this.values[idx] = parent;
            idx = parentIdx;
          }
        }
        sinkDown() {
          let idx = 0;
          const length = this.values.length;
          const element = this.values[0];
          while (true) {
            let leftChildIdx = 2 * idx + 1;
            let rightChildIdx = 2 * idx + 2;
            let leftChild, rightChild;
            let swap = null;

            if (leftChildIdx < length) {
              leftChild = this.values[leftChildIdx];
              if (leftChild.f < element.f) swap = leftChildIdx;
            }
            if (rightChildIdx < length) {
              rightChild = this.values[rightChildIdx];
              if (
                (swap === null && rightChild.f < element.f) ||
                (swap !== null && rightChild.f < leftChild.f)
              ) {
                swap = rightChildIdx;
              }
            }
            if (swap === null) break;
            this.values[idx] = this.values[swap];
            this.values[swap] = element;
            idx = swap;
          }
        }
        get length() {
          return this.values.length;
        }
      }

      // ค่าเริ่มต้น
      let mapA = Array.from({ length: ROW }, () => Array(COL).fill(0));
      let mapB = Array.from({ length: ROW }, () => Array(COL).fill(0));
      mapA[0][0] = 3; // S
      mapA[5][5] = 4; // G

      let currentBrush = 0; // 0=Empty, 1=Wall, 2=Portal, 3=Start, 4=Goal
      let isAnimating = false;
      let isMouseDown = false;

      document.body.onmousedown = () => (isMouseDown = true);
      document.body.onmouseup = () => (isMouseDown = false);

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function setBrush(type, btnElement) {
        currentBrush = type;
        document
          .querySelectorAll(".brush-btn")
          .forEach((btn) => btn.classList.remove("active"));
        btnElement.classList.add("active");
      }

      function applyBrush(z, r, c) {
        if (isAnimating) return;

        let targetMap = z === 0 ? mapA : mapB;

        // กฎ: มี Start และ Goal ได้แค่อย่างละ 1 ตัวในทั้ง 2 แผนที่
        if (currentBrush === 3) removeTile(3);
        if (currentBrush === 4) removeTile(4);

        targetMap[r][c] = currentBrush;
        clearPath(); // รีเซ็ตสีเส้นทางเก่าทิ้ง
        drawGrid();
      }

      function removeTile(type) {
        for (let r = 0; r < ROW; r++) {
          for (let c = 0; c < COL; c++) {
            if (mapA[r][c] === type) mapA[r][c] = 0;
            if (mapB[r][c] === type) mapB[r][c] = 0;
          }
        }
      }

      function drawGrid() {
        createDOMGrid("gridA", mapA, 0);
        createDOMGrid("gridB", mapB, 1);
      }

      function createDOMGrid(containerId, mapData, z) {
        const container = document.getElementById(containerId);
        container.innerHTML = "";
        for (let r = 0; r < ROW; r++) {
          for (let c = 0; c < COL; c++) {
            let div = document.createElement("div");
            div.id = `cell-${z}-${r}-${c}`;
            div.className = "cell " + getCellClass(mapData[r][c]);
            if (mapData[r][c] === 3) div.innerText = "S";
            if (mapData[r][c] === 4) div.innerText = "G";
            if (mapData[r][c] === 2) div.innerText = "🌀";

            // อีเวนต์สำหรับการวาด
            div.onmousedown = () => applyBrush(z, r, c);
            div.onmouseenter = () => {
              if (isMouseDown) applyBrush(z, r, c);
            };

            container.appendChild(div);
          }
        }
      }

      function getCellClass(val) {
        if (val === 1) return "wall";
        if (val === 2) return "portal";
        if (val === 3) return "start";
        if (val === 4) return "goal";
        return "empty";
      }

      function clearPath() {
        if (isAnimating) return;
        drawGrid();
        document.getElementById("stats").innerText =
          "Cost: - | Nodes Expanded: - | Runtime: - ms";
      }

      function findState(type) {
        for (let r = 0; r < ROW; r++) {
          for (let c = 0; c < COL; c++) {
            if (mapA[r][c] === type) return { r, c, z: 0 };
            if (mapB[r][c] === type) return { r, c, z: 1 };
          }
        }
        return null;
      }

      function getNeighbors(state) {
        let neighbors = [];
        let { r, c, z } = state;
        let currentMap = z === 0 ? mapA : mapB;

        // 1. ถ้ายืนอยู่บนพอร์ทัล (บังคับวาร์ป)
        if (currentMap[r][c] === 2) {
          let nz = z === 0 ? 1 : 0;
          let nextMap = nz === 0 ? mapA : mapB;

          // ตรวจสอบว่ามิติปลายทางต้องไม่ใช่กำแพง ถึงจะวาร์ปได้
          if (nextMap[r][c] !== 1) {
            neighbors.push({ r: r, c: c, z: nz, cost: COST_PORTAL });
          }

          // *** จุดสำคัญ: บังคับจบการหาทางรอบข้าง คืนค่าแค่การวาร์ปเท่านั้น ***
          return neighbors;
        }

        // 2. ถ้าไม่ได้อยู่บนพอร์ทัล ค่อยเดินซ้ายขวาหน้าหลังตามปกติ
        const dirs = [
          [-1, 0],
          [1, 0],
          [0, -1],
          [0, 1],
        ];
        for (let d of dirs) {
          let nr = r + d[0],
            nc = c + d[1];
          if (nr >= 0 && nr < ROW && nc >= 0 && nc < COL) {
            if (currentMap[nr][nc] !== 1) {
              // เดินไปทิศที่ไม่มีกำแพง
              neighbors.push({ r: nr, c: nc, z: z, cost: COST_MOVE });
            }
          }
        }

        return neighbors;
      }

      function toggleButtons(disabled) {
        document.getElementById("btn-ucs").disabled = disabled;
        document.getElementById("btn-astar").disabled = disabled;
        document.getElementById("btn-clear").disabled = disabled;
      }

      async function runSearch(type) {
        if (isAnimating) return;

        let startState = findState(3);
        let goalState = findState(4);

        if (!startState || !goalState) {
          alert("ต้องมีจุดเริ่มต้น (S) และเป้าหมาย (G) อย่างน้อย 1 จุด");
          return;
        }

        isAnimating = true;
        toggleButtons(true);
        drawGrid(); // ล้างร่องรอยเดิม

        let validPortals = [];
        for (let r = 0; r < ROW; r++) {
          for (let c = 0; c < COL; c++) {
            if (mapA[r][c] === 2 && mapB[r][c] !== 1)
              validPortals.push({ r, c, fromZ: 0, toZ: 1 });
            if (mapB[r][c] === 2 && mapA[r][c] !== 1)
              validPortals.push({ r, c, fromZ: 1, toZ: 0 });
          }
        }

        let heuristic = (r, c, z) => {
          let manhattanToGoal =
            Math.abs(r - goalState.r) + Math.abs(c - goalState.c);

          // คำนวณแบบ 1: ถ้าอยู่มิติเดียวกับเป้าหมาย ลองประเมินการเดินตรงๆ
          let hDirect = z === goalState.z ? manhattanToGoal : Infinity;

          // คำนวณแบบ 2: ประเมินการเดินผ่านพอร์ทัลที่ใกล้และคุ้มที่สุด
          let hPortal = Infinity;
          for (let p of validPortals) {
            if (p.fromZ === z) {
              let distToPortal = Math.abs(r - p.r) + Math.abs(c - p.c);
              let distFromPortalToGoal =
                Math.abs(p.r - goalState.r) + Math.abs(p.c - goalState.c);

              if (p.toZ === goalState.z) {
                let totalCost =
                  distToPortal + COST_PORTAL + distFromPortalToGoal;
                hPortal = Math.min(hPortal, totalCost);
              }
            }
          }

          // เลือกทางที่ต้นทุนต่ำที่สุด
          let h = Math.min(hDirect, hPortal);

          // กันเหนียว: กรณีที่อยู่คนละมิติแต่ด่านนั้นไม่มีพอร์ทัลเลย (กันติดบั๊กค่า Infinity)
          if (h === Infinity) {
            h = manhattanToGoal + COST_PORTAL;
          }

          return h;
        };

        let t0 = performance.now();
        let pq = new PriorityQueue();
        let visited = new Set();
        let nodesExpanded = 0;
        let finalNode = null;
        let animationSequence = [];
        let maxMemory = 0;

        const ITERATIONS = 1000;
        for (let i = 0; i < ITERATIONS; i++) {
          // ต้องรีเซ็ตตัวแปรใหม่ทุกรอบ
          let pq = new PriorityQueue();
          // *** แก้ไขที่ 1: ต้อง push จุด Start เข้าไปในคิวก่อนเริ่มเดิน ***
          pq.push({
            r: startState.r,
            c: startState.c,
            z: startState.z,
            g: 0,
            f: 0,
            path: [],
          });

          let visited = new Set();
          nodesExpanded = 0;
          maxMemory = 0;
          animationSequence = [];
          finalNode = null;

          while (pq.length > 0) {
            maxMemory = Math.max(maxMemory, pq.length + visited.size);

            let curr = pq.shift();

            let stateKey = `${curr.z}-${curr.r}-${curr.c}`;
            if (visited.has(stateKey)) continue;
            visited.add(stateKey);
            nodesExpanded++;
            animationSequence.push({ r: curr.r, c: curr.c, z: curr.z });

            if (
              curr.r === goalState.r &&
              curr.c === goalState.c &&
              curr.z === goalState.z
            ) {
              finalNode = curr;
              break;
            }

            let neighbors = getNeighbors(curr);
            for (let n of neighbors) {
              let nextG = curr.g + n.cost;
              let nextF =
                nextG + (type === "ASTAR" ? heuristic(n.r, n.c, n.z) : 0);
              let nextPath = [
                ...curr.path,
                { r: curr.r, c: curr.c, z: curr.z },
              ];

              // *** แก้ไขที่ 2: เปลี่ยนจากค่า startState กลับมาเป็นค่า n (เพื่อนบ้าน) และ nextG, nextF ***
              pq.push({
                r: n.r,
                c: n.c,
                z: n.z,
                g: nextG,
                f: nextF,
                path: nextPath,
              });
            }
          }
        }

        let t1 = performance.now();
        // นำเวลาทั้งหมดมาหารด้วยจำนวนรอบ
        let avgRuntime = (t1 - t0) / ITERATIONS;

        document.getElementById("stats").innerText =
          `[${type}] กำลังค้นหาเส้นทาง...`;

        for (let node of animationSequence) {
          let domCell = document.getElementById(
            `cell-${node.z}-${node.r}-${node.c}`,
          );
          if (
            !domCell.classList.contains("start") &&
            !domCell.classList.contains("goal")
          ) {
            domCell.classList.add("visited");
          }
          await sleep(20);
        }

        // โค้ดที่แก้ไขแล้ว
        if (finalNode) {
          for (let p of finalNode.path) {
            let domCell = document.getElementById(`cell-${p.z}-${p.r}-${p.c}`);

            // ยกเว้นแค่จุด Start ที่จะไม่เปลี่ยนเป็นสีฟ้า (พอร์ทัลจะโดนระบายสีฟ้าด้วย)
            if (!domCell.classList.contains("start")) {
              domCell.classList.remove("visited");
              domCell.classList.add("path");
            }
            await sleep(50);
          }
          document.getElementById("stats").innerText =
            `[${type}] Cost: ${finalNode.g} | Nodes Expanded: ${nodesExpanded} | Max Memory: ${maxMemory} nodes | Runtime: ${avgRuntime.toFixed(4)} ms`;
        } else {
          document.getElementById("stats").innerText =
            "ค้นหาเส้นทางไม่พบ! (อาจโดนกำแพงปิดตาย)";
        }

        isAnimating = false;
        toggleButtons(false);
      }

      // วาดฉากเปล่าๆ เมื่อโหลดเสร็จ
      window.onload = drawGrid;
    </script>
  </body>
</html>
